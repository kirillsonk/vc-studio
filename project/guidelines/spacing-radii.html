<!-- @dsCard group="Spacing" viewport="700x170" name="Радиусы и линии" subtitle="4 / 8 / 12. Без pill, без 24+. Структура через 1px линии, а не карточки" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:170px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw"><i style="border-radius:var(--radius-sm);background:var(--surface);height:72px"></i><small>4 · чекбокс, тег</small></div><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface);height:72px"></i><small>8 · кнопки, поля, опции</small></div><div class="sw"><i style="border-radius:var(--radius-lg);background:var(--surface);height:72px"></i><small>12 · большой interactive canvas</small></div><div class="sw" style="flex:2"><div style="height:72px;display:flex;flex-direction:column;justify-content:space-between;border-top:var(--border);border-bottom:var(--border);padding:8px 0"><span style="font:var(--type-body-sm)">Заголовок</span><span style="font:var(--type-caption);color:var(--text-3)">контент между линиями</span></div><small>секция без карточки</small></div></div></body></html>
