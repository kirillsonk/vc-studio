<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:190px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--vermilion)"></i><b>brand</b><small>#D9451A</small></div><div class="sw"><i style="background:var(--vermilion-hover)"></i><b>hover</b><small>#BF3A13</small></div><div class="sw"><i style="background:var(--vermilion-press)"></i><b>press</b><small>#A3300E</small></div><div class="sw"><i style="background:var(--vermilion-soft)"></i><b>soft</b><small>#FBEAE3</small></div><div class="sw" style="flex:0 0 72px"><i style="background:var(--blue)"></i><b>accent-2</b><small>#3157FF</small></div><div style="flex:2;display:flex;flex-direction:column;gap:8px;justify-content:center"><span style="background:var(--brand);color:#fff;padding:10px 14px;font:var(--type-label);border-radius:var(--radius-md);align-self:flex-start">Запустить проект</span><span style="color:var(--brand);font:var(--type-body-sm)">ссылка · активный пункт · выбранная опция · trace</span></div></div><div class="lbl" style="margin-top:14px">Синий — только второй акцент в данных и редких выделениях (Compare, диаграммы). Не для кнопок и не как заливка.</div></body></html>
