<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:170px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw" style="flex:0 0 120px"><i style="background:var(--green)"></i><b>positive</b><small>#0FAF7A</small></div><div class="sw" style="flex:0 0 120px"><i style="background:var(--green-soft)"></i><b>positive-soft</b><small>#E4F7EF</small></div><div style="flex:1;border:var(--border);background:var(--surface);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center"><span style="display:flex;align-items:center;gap:8px;font:var(--type-label-sm);color:var(--green)"><i style="width:8px;height:8px;border-radius:50%;background:var(--green)"></i>Live</span><span data-num style="font:var(--type-label-sm);color:var(--green)">Production ready</span><span data-num style="font:var(--type-label-sm);color:var(--green)">+34% быстрее</span><span data-num style="font:var(--type-label-sm);color:var(--green)">Экономия 128 000 ₽</span></div></div></body></html>
