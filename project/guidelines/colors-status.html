<!-- @dsCard group="Colors" viewport="700x160" name="Статусы" subtitle="Warning, error, disabled — приглушённые, без заливок на всю ширину" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:160px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--amber)"></i><b>warning</b><small>#D98700</small></div><div class="sw"><i style="background:var(--red)"></i><b>error</b><small>#D83A3A</small></div><div class="sw"><i style="background:var(--disabled-bg)"></i><b style="color:var(--disabled-text)">disabled</b><small>#EDEDE9 / #92969D</small></div><div style="flex:2;display:flex;flex-direction:column;gap:8px;justify-content:center"><span style="font:var(--type-body-sm);color:var(--error)">Проверьте адрес почты</span><span style="font:var(--type-body-sm);color:var(--amber)">Расход AI выше оценки на 12%</span><span style="font:var(--type-body-sm);color:var(--disabled-text)">Недоступно</span></div></div></body></html>
