<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--canvas)"></i><b>canvas</b><small>--canvas · #F5F5F2</small></div><div class="sw"><i style="background:var(--surface)"></i><b>surface</b><small>--surface · #FFFFFF</small></div><div class="sw"><i style="background:var(--surface-2)"></i><b>surface-2</b><small>--surface-2 · #EDEDE9</small></div><div class="sw"><i style="background:var(--line)"></i><b>line</b><small>--line · #D9DAD6</small></div><div class="sw"><i style="background:var(--line-strong)"></i><b>line-strong</b><small>--line-strong · #BFC1BC</small></div><div class="sw"><i style="background:var(--contrast)"></i><b>contrast</b><small>--contrast · #111214</small></div></div></body></html>
