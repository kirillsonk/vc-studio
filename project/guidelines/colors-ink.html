<!-- @dsCard group="Colors" viewport="700x150" name="Текст" subtitle="Ink почти чёрный, два уровня серого. Body не бледнее ink-2" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div style="flex:1;border:var(--border);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:6px"><span style="font:var(--type-body);color:var(--ink)">ink — основной #111214</span><span style="font:var(--type-body);color:var(--ink-2)">ink-2 — вторичный #62666D</span><span style="font:var(--type-body);color:var(--ink-3)">ink-3 — подписи, метки #92969D</span></div><div style="flex:1;background:var(--contrast);padding:16px;display:flex;flex-direction:column;gap:6px"><span style="font:var(--type-body);color:var(--contrast-ink)">contrast-ink</span><span style="font:var(--type-body);color:var(--contrast-ink-2)">contrast-ink-2</span><span style="font:var(--type-body);color:var(--brand)">brand остаётся синим</span></div></div></body></html>
