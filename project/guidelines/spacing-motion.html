<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:170px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><style>@keyframes draw{to{stroke-dashoffset:0}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(160px)}}</style><div class="row" style="align-items:center"><div style="flex:1"><div style="width:32px;height:10px;background:var(--brand);animation:slide 2.2s var(--ease) infinite"></div><div class="lbl" style="margin-top:8px">ease · number transitions · state</div></div><div style="flex:1"><svg width="220" height="40" viewBox="0 0 220 40"><path d="M2 20 H70 L90 8 H150 L170 32 H218" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="300" stroke-dashoffset="300" style="animation:draw 1.6s var(--ease) infinite alternate"></path><circle cx="218" cy="20" r="3" fill="var(--green)"></circle></svg><div class="lbl" style="margin-top:4px">line draw · production trace</div></div><div style="flex:1"><div class="lbl">Не анимируем: обычный текст, повторяющийся fade-up</div></div></div></body></html>
