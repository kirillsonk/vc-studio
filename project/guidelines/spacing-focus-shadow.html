<!-- @dsCard group="Spacing" viewport="700x150" name="Фокус и тени" subtitle="Focus — 2px blue ring. Тень только у floating UI" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row"><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface);height:72px;outline:var(--focus-outline);outline-offset:var(--focus-offset)"></i><small>:focus-visible</small></div><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface);height:72px;border-color:var(--brand)"></i><small>input focus border</small></div><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface);height:72px;border:none;box-shadow:var(--shadow-float)"></i><small>shadow-float · dropdown, popover</small></div><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface);height:72px"></i><small>карточки — только border</small></div></div></body></html>
