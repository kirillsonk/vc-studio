<!-- @dsCard group="Type" viewport="700x190" name="Цифры" subtitle="Та же гарнитура, tabular-nums. Цифры — часть айдентики, без monospace" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;width:700px;height:190px;overflow:hidden}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border:1px solid var(--line)}.sw b{font:var(--type-label-sm);color:var(--text)}.sw small{font:var(--type-caption);color:var(--text-3);font-feature-settings:var(--num-features)}.lbl{font:var(--type-caption);color:var(--text-3)}</style></head><body><div class="row" style="align-items:flex-end;gap:40px"><div><div class="lbl" style="margin-bottom:8px">num-xl</div><div data-num style="font:var(--type-num-xl);font-size:80px;letter-spacing:var(--track-num)">1 284 310</div></div><div><div class="lbl" style="margin-bottom:8px">num-lg · num-md</div><div data-num style="font:var(--type-num-lg);letter-spacing:var(--track-num)">184 320 ₽</div><div data-num style="font:var(--type-num-md);letter-spacing:var(--track-num);color:var(--text-2);margin-top:8px">9 дней</div></div><div><div class="lbl" style="margin-bottom:8px">positive</div><div data-num style="font:var(--type-num-sm);color:var(--green)">−128 000 ₽</div></div></div></body></html>
