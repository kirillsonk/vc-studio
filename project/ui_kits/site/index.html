<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VC Studio — AI-native production</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>h1,h2,h3{text-wrap:balance}
@media(max-width:1100px){:root{--container-pad:32px}}
@media(max-width:900px){:root{--container-pad:20px}.grid{grid-template-columns:1fr!important}.grid3{grid-template-columns:1fr 1fr!important}.nav-links{display:none!important}section{padding-top:88px!important}footer{margin-top:88px!important}}
</style></head>
<body><template id="__bundler_thumbnail" data-bg-color="#F5F5F2"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#F5F5F2"/><rect x="100" y="280" width="520" height="56" fill="#111214"/><rect x="100" y="360" width="380" height="56" fill="#111214" opacity=".35"/><rect x="720" y="260" width="380" height="280" rx="12" fill="#fff" stroke="#D9DAD6" stroke-width="3"/><rect x="760" y="310" width="200" height="14" fill="#D9451A"/><circle cx="1060" cy="317" r="8" fill="#0FAF7A"/></svg></template><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Intake.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
function Home({go}){return <main><Hero go={go}/><Demos/><Cases go={go}/><WhatWeDo/><Economics/><Process/><Agencies go={go}/><FAQ/><Intake/></main>}
function App(){const [screen,setScreen]=React.useState('home');
const go=(s,anchor)=>{setScreen(s);setTimeout(()=>{const el=anchor&&document.getElementById(anchor);window.scrollTo({top:el?el.offsetTop-72:0,behavior:'smooth'})},60)};
return <div data-screen-label={screen}><Nav go={go} screen={screen}/>{screen==='home'?<Home go={go}/>:screen==='case'?<CasePage go={go}/>:<ReportPage go={go}/>}<Footer go={go}/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
